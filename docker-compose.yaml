version: "3.9"

services:
  redis:
    image: redis:latest
    restart: on-failure
    env_file:
      - .env
    expose:
      - "6379"


  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "-c", "pg_isready -U $USER"]
      interval: 10s
      retries: 5
      timeout: 5s
      
  college:
    build: .
    tty: true
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - .:/app

  celery:
    build: .
    tty: true
    restart: on-failure
    env_file:
      - .env
    command: celery -A config worker -l INFO
    depends_on:
      - redis
      - db
      - college

    volumes:
      - .:/college

  celery-beat:
    build: .
    tty: true
    restart: on-failure
    env_file:
      - .env
    command: celery -A config beat -l INFO
    depends_on:
      - redis
      - db
      - college

    volumes:
      - .:/college

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - staticfiles:/app/static
      - media_volume:/media
    depends_on:
      - college

volumes:
  pg_data:
  staticfiles:
  media_volume:
