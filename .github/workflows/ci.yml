name: Deploy Django Project
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.DATABASE_NAME }}
          POSTGRES_USER: ${{ secrets.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 3
          done
      - name: Wait for Redis
        run: |
         until docker exec $(docker ps -q -f ancestor=redis:7) redis-cli ping | grep PONG; do
            echo "Waiting for Redis..."
            sleep 3
          done
      - name: Run migrations
        env:
          NAME: ${{ secrets.DATABASE_NAME }}
          USER: ${{ secrets.DATABASE_USER }}
          PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          HOST: localhost
          PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: True
        run: |
            python manage.py migrate
          

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to YandexCloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd drf
            cat << 'EOF' > .env
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            NAME=${{ secrets.DATABASE_NAME }}
            USER=${{ secrets.DATABASE_USER }}
            PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            HOST=localhost
            PORT=5432
            
            # Django
            DEBUG=True
            
            # Stripe
            STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
            
            # Redis
            LOCATION=${{ secrets.LOCATION }}

            EOF
            
            # Останавливаем старые контейнеры, если они есть
            sudo docker compose down || true
            sudo docker system prune -a
            # Подтягиваем свежий код
            git pull origin develop || git clone -b develop git@github.com:${{ github.repository }}.git .
            # Собираем и запускаем контейнеры
            sudo docker compose up -d --build